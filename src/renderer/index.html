      .text-button.toggle.on {
        background: #2f4a7a;
        border-color: #3f5f99;
      }
      .icon-button.small {
        width: 22px;
        height: 22px;
        border-radius: 5px;
      }
      .field {
        display: flex;
        align-items: center;
        height: 28px;
        min-width: 0;
        background: #20232a;
        border: 1px solid transparent;
        border-radius: 6px;
        transition: border-color 120ms ease-out;
      }
      .field:hover {
        border-color: #343840;
      }
      .field:focus-within {
        border-color: #4a6fae;
      }
      .field.disabled {
        opacity: 0.5;
      }
      .field.disabled:hover {
        border-color: transparent;
      }
      .field-label {
        flex: none;
        min-width: 24px;
        padding: 0 4px 0 8px;
        display: flex;
        align-items: center;
        color: #8a8f98;
        font-size: 11px;
        cursor: ew-resize;
        user-select: none;
      }
      .field.disabled .field-label {
        cursor: default;
      }
      .field .field-input {
        flex: 1;
        min-width: 0;
        width: 100%;
        background: none;
        border: none;
        outline: none;
        color: #e6e7ea;
        font: inherit;
        font-variant-numeric: tabular-nums;
        padding: 0 6px 0 0;
        height: 100%;
      }
      .field-input.full,
      .color-hex {
        height: 28px;
        box-sizing: border-box;
        background: #20232a;
        border: 1px solid transparent;
        border-radius: 6px;
        color: #e6e7ea;
        font: inherit;
        padding: 0 8px;
        outline: none;
        min-width: 0;
      }
      .field-input.full:hover,
      .color-hex:hover {
        border-color: #343840;
      }
      .field-input.full:focus,
      .color-hex:focus {
        border-color: #4a6fae;
      }
      .inspector label.field select.field-input {
        appearance: none;
      }
      .size-row {
        display: flex;
        gap: 4px;
        min-width: 0;
      }
      .size-row .field {
        flex: 1;
      }
      .size-mode {
        height: 28px;
        min-width: 0;
        max-width: 64px;
        background: #20232a;
        border: 1px solid transparent;
        border-radius: 6px;
        color: #c4c8ce;
        font: inherit;
        font-size: 11px;
        padding: 0 4px;
        outline: none;
      }
      .size-mode.wide {
        max-width: none;
        width: 100%;
        padding: 0 6px;
        font-size: 12px;
      }
      .size-mode.grow {
        flex: 1;
      }
      .size-mode:hover {
        border-color: #343840;
      }
      .size-mode:focus-visible {
        border-color: #4a6fae;
      }
      .color-field {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        height: 28px;
      }
      .color-field .color-hex {
        flex: 1;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
      }
      .color-swatch {
        position: relative;
        width: 20px;
        height: 20px;
        flex: none;
        border-radius: 5px;
        box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.14);
        overflow: hidden;
        background-image: repeating-conic-gradient(#3a3e46 0 25%, #2a2d34 0 50%);
        background-size: 8px 8px;
      }
      .color-swatch input {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
        width: 100%;
        height: 100%;
      }
      .token-chip {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        min-width: 0;
        height: 22px;
        padding: 0 2px 0 7px;
        border-radius: 5px;
        background: #2a2440;
        color: #d6c9ff;
        font: 11px ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .token-chip button {
        display: grid;
        place-items: center;
        width: 18px;
        height: 18px;
        background: none;
        border: none;
        border-radius: 4px;
        color: inherit;
        cursor: pointer;
      }
      .token-chip button:hover {
        background: rgb(255 255 255 / 0.1);
      }
      .effect {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .effect + .effect {
        padding-top: 6px;
        border-top: 1px dashed #2c2f36;
      }
      .inspector .segmented {
        margin: 0;
        height: 28px;
        box-sizing: border-box;
        background: #20232a;
        border-color: transparent;
      }
      .inspector .segmented button {
        display: grid;
        place-items: center;
      }
      .align-row {
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }
      .align-grid {
        display: grid;
        grid-template-columns: repeat(3, 20px);
        grid-template-rows: repeat(3, 20px);
        gap: 2px;
        padding: 4px;
        background: #20232a;
        border-radius: 6px;
      }
      .align-grid button {
        display: grid;
        place-items: center;
        background: none;
        border: none;
        border-radius: 4px;
        padding: 0;
        cursor: pointer;
      }
      .align-grid button span {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #5a5f68;
      }
      .align-grid button:hover span {
        background: #a3a8b0;
      }
      .align-grid button.active span {
        width: 10px;
        height: 4px;
        border-radius: 2px;
        background: #7fb0ff;
      }
      .variable-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .variable-list li {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 24px;
        font-size: 12px;
      }
      .color-dot {
        width: 12px;
        height: 12px;
        flex: none;
        border-radius: 3px;
        box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.14);
      }
      .variable-type {
        width: 12px;
        flex: none;
        color: #7e838c;
        font: 9px ui-monospace, monospace;
      }
      .variable-name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
      }
      .variable-value {
        color: #8a8f98;
        font: 11px ui-monospace, monospace;
        max-width: 40%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .prop-section > .field .field-label {
        min-width: 64px;
        text-transform: capitalize;
        cursor: default;
      }
      .prop-section > .field select.field-input {
        background: none;
        color: #e6e7ea;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
